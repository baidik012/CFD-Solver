[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-solver"
dynamic = ["version"]
description = "Incompressible fluid flow solver using Chorin's projection method"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cfd = "cfd_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^v?(?P<version>[0-9]+(?:\\.[0-9]+)*)$"
fallback_version = "0.3.3"